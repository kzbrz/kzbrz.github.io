
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleepover Report Card</title>
    <style>
        :root {
            --bg-color: #fdfbf7;
            --card-bg: #ffffff;
            --kendall-accent: #ff70a6;
            --jordan-accent: #70d6ff;
            --text-main: #2b2d42;
            --green-rag: #38b000;
            --amber-rag: #ffb703;
            --red-rag: #e63946;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2.2rem;
            margin: 0 0 5px 0;
            color: #3d348b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #7678ed;
            font-weight: 600;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        .person-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            padding: 20px;
            border-top: 8px solid #ccc;
        }

        .person-card.kendall { border-top-color: var(--kendall-accent); }
        .person-card.jordan { border-top-color: var(--jordan-accent); }

        .person-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #eee;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .person-name {
            font-size: 1.6rem;
            font-weight: 700;
        }

        .score-badge {
            background: #f1f3f5;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .category-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .category-item {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 12px;
            align-items: start;
            padding: 10px;
            border-radius: 10px;
            background: #fafafa;
        }

        .category-icon {
            font-size: 1.4rem;
            line-height: 1;
        }

        .category-details strong {
            display: block;
            font-size: 0.95rem;
            margin-bottom: 2px;
        }

        .category-details p {
            margin: 0;
            font-size: 0.85rem;
            color: #6c757d;
        }

        .rag-select {
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        .rag-green { background-color: #d8f3dc; color: #1b4332; border-color: var(--green-rag); }
        .rag-amber { background-color: #fff3bf; color: #744210; border-color: var(--amber-rag); }
        .rag-red { background-color: #ffc9c9; color: #820000; border-color: var(--red-rag); }

        .add-note-section {
            max-width: 1100px;
            margin: 30px auto 0 auto;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
        }

        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        input, select, button {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 0.95rem;
        }

        button {
            background-color: #3d348b;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2b2366;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sleepover Report Card</h1>
        <div class="subtitle">Evaluation Dashboard</div>
    </header>

    <div class="container">
        <!-- Kendall's Card -->
        <div class="person-card kendall" id="card-kendall">
            <div class="person-header">
                <span class="person-name">Kendall</span>
                <span class="score-badge" id="score-kendall">0 / 10</span>
            </div>
            <div class="category-list" id="list-kendall">
                <!-- Items generated via JS -->
            </div>
        </div>

        <!-- Jordan's Card -->
        <div class="person-card jordan" id="card-jordan">
            <div class="person-header">
                <span class="person-name">Jordan</span>
                <span class="score-badge" id="score-jordan">0 / 10</span>
            </div>
            <div class="category-list" id="list-jordan">
                <!-- Items generated via JS -->
            </div>
        </div>
    </div>

    <!-- Note Adder -->
    <div class="add-note-section">
        <h3>Add or Update a Note</h3>
        <div class="form-group">
            <select id="input-person">
                <option value="kendall">Kendall</option>
                <option value="jordan">Jordan</option>
            </select>
            <input type="text" id="input-category" placeholder="Category Name">
            <input type="text" id="input-note" placeholder="Details/Notes">
            <select id="input-rag">
                <option value="green">Green (Good)</option>
                <option value="amber">Amber (Okay)</option>
                <option value="red">Red (Needs Work)</option>
            </select>
            <button onclick="addCustomEntry()">Add Note</button>
        </div>
    </div>

    <script>
        const initialData = {
            kendall: [
                { icon: '📋', name: 'Prep Readiness', note: 'No help was offered for setup beforehand (zilch effort).', status: 'red' },
                { icon: '👋', name: 'Introductions & Hosting', note: 'Introduced guests, offered drinks, and ate too small a dinner.  Ate only junk food leading to barfing guest.', status: 'amber' },
                { icon: '🎵', name: 'Music Patrol', note: 'Loud music turned down by 10:00 PM. No music used.', status: 'green' },
                { icon: '🏊‍♂️', name: 'Pool Noise & Volume', note: 'Late-night swimming well past the 12:00 AM screaming cutoff. Pool left without stuff put away.', status: 'red' },
                { icon: '♨️', name: 'Hot Tub Noise & Volume', note: 'Hot tub used past the 12:30 AM closing cutoff.', status: 'red' },
                { icon: '🏡', name: 'Respect of Neighbors', note: 'Noise levels and late activity were elevated past cutoffs; room for improvement.', status: 'amber' },
                { icon: '🌙', name: 'Late-Night Routine', note: 'Failed strict quiet time (2:00 AM cutoff); continuous noise, movement, and coming/going until 6:30 AM.', status: 'red' },
                { icon: '🥞', name: 'Breakfast', note: 'The whole group woke up and ate breakfast together.', status: 'green' },
                { icon: '🧹', name: 'Clean-Up Crew', note: 'Mattresses, blankets, and snack debris left behind; chlorine bottle was left out and not put away.', status: 'red' }
            ],
            jordan: [
                { icon: '📋', name: 'Prep Readiness', note: 'Assisted with setup before guests arrived.', status: 'green' },
                { icon: '👋', name: 'Introductions & Hosting', note: 'Introduced guests, offered drinks, and ate too small of a reasonable dinner.', status: 'amber' },
                { icon: '🎵', name: 'Music Patrol', note: 'Loud music cut at 10:00 PM; all music off before 11:00 PM deadline. Great DJ control.', status: 'green' },
                { icon: '🏊‍♂️', name: 'Pool Noise & Volume', note: 'Screaming stopped and noise was kept in check ahead of the 12:00 AM cutoff; pool left without stuff put away.', status: 'green' },
                { icon: '♨️', name: 'Hot Tub Noise & Volume', note: 'Screaming kept in check and wrapped up within the 12:30 AM cutoff time.', status: 'amber' },
                { icon: '🏡', name: 'Respect of Neighbors', note: 'Noise control maintained within guideline times (10/11 PM music, 12 AM pool, 12:30 AM hot tub).', status: 'green' },
                { icon: '🌙', name: 'Late-Night Routine', note: 'Inside house giggling and talking extended past the 2:00 AM quiet time deadline (zero noise rule).', status: 'amber' },
                { icon: '🥞', name: 'Breakfast', note: 'Guests were not served breakfast by the host in the morning (kitchen empty).', status: 'red' },
                { icon: '🧹', name: 'Clean-Up Crew', note: 'Mattresses, sleeping bags, and personal gear left scattered in living room; chlorine bottle left out and not put away.', status: 'red' }
            ]
        };

        function calculateScore(items) {
            let points = 0;
            items.forEach(item => {
                if (item.status === 'green') points += 2;
                else if (item.status === 'amber') points += 1;
            });
            const maxPoints = items.length * 2;
            return Math.round((points / maxPoints) * 10);
        }

        function renderCard(person) {
            const listContainer = document.getElementById(`list-${person}`);
            const scoreContainer = document.getElementById(`score-${person}`);
            listContainer.innerHTML = '';

            initialData[person].forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'category-item';
                div.innerHTML = `
                    <span class="category-icon">${item.icon}</span>
                    <div class="category-details">
                        <strong>${item.name}</strong>
                        <p>${item.note}</p>
                    </div>
                    <select class="rag-select rag-${item.status}" onchange="updateRAG('${person}', ${index}, this.value)">
                        <option value="green" ${item.status === 'green' ? 'selected' : ''}>Green</option>
                        <option value="amber" ${item.status === 'amber' ? 'selected' : ''}>Amber</option>
                        <option value="red" ${item.status === 'red' ? 'selected' : ''}>Red</option>
                    </select>
                `;
                listContainer.appendChild(div);
            });

            scoreContainer.innerText = `${calculateScore(initialData[person])} / 10`;
        }

        function updateRAG(person, index, newStatus) {
            initialData[person][index].status = newStatus;
            renderCard(person);
        }

        function addCustomEntry() {
            const person = document.getElementById('input-person').value;
            const name = document.getElementById('input-category').value.trim();
            const note = document.getElementById('input-note').value.trim();
            const status = document.getElementById('input-rag').value;

            if (!name || !note) {
                alert('Please fill in both the category name and note.');
                return;
            }

            initialData[person].push({ icon: '📝', name, note, status });
            renderCard(person);

            document.getElementById('input-category').value = '';
            document.getElementById('input-note').value = '';
        }

        // Initial Render
        renderCard('kendall');
        renderCard('jordan');
    </script>
</body>
</html>
